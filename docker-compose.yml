name: enjoys-caldev

networks:
  caldev_net:
    driver: bridge

services:
  # ============================================================
  # Valkey (Redis-compatible — job queue, caching, sync tokens)
  # ============================================================
  valkey:
    image: valkey/valkey:8-alpine
    container_name: caldev-valkey
    restart: unless-stopped
    networks:
      - caldev_net
    ports:
      - "127.0.0.1:6382:6379" # host-local only: Valkey has no password, and published ports bypass ufw
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # CalDAV + JMAP Server
  # ============================================================
  caldev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caldev-server
    restart: unless-stopped
    networks:
      - caldev_net
    ports:
      - "8443:8443"
    # All settings come from the .env file next to this compose file (see .env.example):
    # database, auth, CALDEV_PUBLIC_URL, AIRSEND_INTERNAL_*, worker, ...
    # (the image does not contain .env; compose injects it)
    env_file:
      - .env
    # Lets .env point DB_HOST (etc.) at host.docker.internal on Linux, where Docker
    # does not define that name by default (Docker Desktop already does).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Only what must differ inside the container network. These win over .env.
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8443"                  # matches the port mapping above
      REDIS_URL: "redis://valkey:6379/0"   # the valkey service on caldev_net
    depends_on:
      valkey:
        condition: service_healthy

volumes:
  valkeydata:
    driver: local
