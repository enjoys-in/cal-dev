name: enjoys-caldev

networks:
  caldev_net:
    driver: bridge

services:
  # ============================================================
  # Valkey (Redis-compatible — job queue, caching, sync tokens)
  # ============================================================
  valkey:
    image: valkey/valkey:8-alpine
    container_name: caldev-valkey
    restart: unless-stopped
    networks:
      - caldev_net
    ports:
      - "6382:6379" # Exposed on 6380 instead of 6379 to avoid conflicts with other local Redis instances, though networks mostly isolate this
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # CalDAV + JMAP Server
  # ============================================================
  caldev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caldev-server
    restart: unless-stopped
    networks:
      - caldev_net
    ports:
      - "8443:8443"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8443"
      
      # ============================================================
      # External PostgreSQL Configuration
      # Please update these to point to your existing PostgreSQL DB
      # ============================================================
      DB_HOST: "${DB_HOST:-host.docker.internal}" # Update with your external postgres host
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: "${DB_USER:-caldev}"
      DB_PASSWORD: "${DB_PASSWORD:-caldev}"
      DB_NAME: "${DB_NAME:-caldev}"
      DB_SCHEMA: "${DB_SCHEMA:-caldev}"
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: "50"
      DB_MAX_IDLE_CONNS: "10"
      
      # Valkey (Redis-compatible)
      REDIS_URL: "redis://valkey:6379/0" # Connects internally via caldev_net network
      
      # Auth — use same JWT secret & issuer as your mail/other services
      AUTH_JWT_SECRET: e783e9b23f8b14e6b245e8b479a503d402fad947758f9006e70d30a32d605661ac00645bbf2f1d3894aaff7b01fccabea47a7c417737fb0d9802e297a21b6167
      AUTH_JWT_ISSUER: ENJOYS
      AUTH_BASIC_ENABLED: "true"
      
      # Admin API key for user provisioning
      ADMIN_API_KEY: "${ADMIN_API_KEY:-caldev-admin-secret-key-change-me}"
      
      # App header validation
      APP_API_KEY: "${APP_API_KEY:-}"
      APP_NAME: "AirSend"
      APP_VERSION: "1.0.0"
      APP_SIGNATURE: "${APP_SIGNATURE:-}"
      
      # Worker
      WORKER_CONCURRENCY: "4"
      WORKER_QUEUE_PREFIX: "caldev:jobs"
      WORKER_RETRY_MAX: "3"
      
      # Server
      TLS_ENABLED: "false"
    depends_on:
      valkey:
        condition: service_healthy

volumes:
  valkeydata:
    driver: local
